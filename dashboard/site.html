<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OGVendors — Premium Shopify Theme for Resellers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --bg-card: #0a0a0a;
      --bg-elevated: #111;
      --bg-hover: #161616;
      --border: #1a1a1a;
      --border-light: #2a2a2a;
      --accent: #39ff14;
      --accent-dim: rgba(57,255,20,0.08);
      --accent-glow: rgba(57,255,20,0.2);
      --red: #ef4444;
      --text: #fafafa;
      --text-muted: #888;
      --text-subtle: #555;
      --font: 'Inter', -apple-system, sans-serif;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; }
    input { font-family: inherit; }
    img { display: block; max-width: 100%; }

    /* ─── NAVIGATION ─── */
    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 16px 24px; transition: background 0.3s; }
    .nav.scrolled { background: rgba(5,5,5,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
    .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; align-items: center; gap: 32px; }
    .nav-links a { font-size: 14px; font-weight: 500; color: var(--text-muted); transition: color 0.2s; }
    .nav-links a:hover { color: var(--text); }
    .nav-btn { padding: 10px 24px; border-radius: 999px; font-size: 13px; font-weight: 700; transition: all 0.2s; }
    .nav-btn-outline { background: transparent; border: 1px solid var(--border-light); color: var(--text); }
    .nav-btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .nav-btn-primary { background: var(--accent); color: #000; }
    .nav-btn-primary:hover { box-shadow: 0 0 30px var(--accent-glow); }

    /* ─── HERO ─── */
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 120px 24px 80px; position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; top: -200px; left: 50%; transform: translateX(-50%); width: 800px; height: 800px; background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%); pointer-events: none; opacity: 0.4; }
    .hero-content { position: relative; z-index: 2; max-width: 800px; }
    .hero-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: var(--accent-dim); border: 1px solid rgba(57,255,20,0.15); font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 32px; }
    .hero-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
    .hero h1 { font-size: clamp(48px, 8vw, 80px); font-weight: 900; letter-spacing: -3px; line-height: 0.95; margin-bottom: 24px; }
    .hero h1 .accent { color: var(--accent); }
    .hero p { font-size: 18px; color: var(--text-muted); line-height: 1.6; max-width: 550px; margin: 0 auto 40px; }
    .hero-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .btn-lg { padding: 16px 40px; border-radius: 999px; font-size: 15px; font-weight: 800; transition: all 0.3s; }
    .btn-accent { background: var(--accent); color: #000; box-shadow: 0 4px 20px rgba(57,255,20,0.3); }
    .btn-accent:hover { box-shadow: 0 8px 40px rgba(57,255,20,0.5); transform: translateY(-2px); }
    .btn-ghost { background: transparent; border: 1px solid var(--border-light); color: var(--text); }
    .btn-ghost:hover { border-color: var(--text-muted); }
    .hero-stats { display: flex; gap: 48px; justify-content: center; margin-top: 64px; }
    .hero-stat { text-align: center; }
    .hero-stat-num { font-size: 32px; font-weight: 900; letter-spacing: -1px; }
    .hero-stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    /* ─── SECTIONS ─── */
    .section { padding: 100px 24px; }
    .section-header { text-align: center; max-width: 600px; margin: 0 auto 60px; }
    .section-header h2 { font-size: clamp(32px, 5vw, 48px); font-weight: 900; letter-spacing: -2px; margin-bottom: 16px; }
    .section-header p { font-size: 16px; color: var(--text-muted); line-height: 1.6; }

    /* ─── FEATURES GRID ─── */
    .features-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .feature-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; transition: all 0.3s; }
    .feature-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .feature-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--accent-dim); display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 20px; }
    .feature-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .feature-card p { font-size: 14px; color: var(--text-muted); line-height: 1.5; }

    /* ─── PRICING ─── */
    .pricing-grid { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
    .pricing-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; position: relative; transition: all 0.3s; }
    .pricing-card.featured { border-color: var(--accent); box-shadow: 0 0 60px rgba(57,255,20,0.1); }
    .pricing-card.featured::before { content: 'MOST POPULAR'; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); padding: 6px 20px; border-radius: 999px; background: var(--accent); color: #000; font-size: 11px; font-weight: 800; letter-spacing: 0.05em; }
    .pricing-name { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .pricing-price { font-size: 48px; font-weight: 900; letter-spacing: -2px; margin-bottom: 4px; }
    .pricing-price span { font-size: 16px; font-weight: 500; color: var(--text-muted); letter-spacing: 0; }
    .pricing-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 32px; }
    .pricing-features { list-style: none; margin-bottom: 32px; }
    .pricing-features li { padding: 10px 0; font-size: 14px; color: var(--text-muted); display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
    .pricing-features li:last-child { border: none; }
    .pricing-features .check { color: var(--accent); font-size: 16px; flex-shrink: 0; }
    .pricing-btn { width: 100%; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 700; text-align: center; transition: all 0.3s; display: block; }
    .pricing-btn-accent { background: var(--accent); color: #000; }
    .pricing-btn-accent:hover { box-shadow: 0 8px 30px rgba(57,255,20,0.4); }
    .pricing-btn-outline { background: transparent; border: 1px solid var(--border-light); color: var(--text); }
    .pricing-btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* ─── TESTIMONIALS ─── */
    .testimonials-row { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .testimonial-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
    .testimonial-stars { color: #fbbf24; font-size: 14px; margin-bottom: 16px; }
    .testimonial-text { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; }
    .testimonial-author { display: flex; align-items: center; gap: 12px; }
    .testimonial-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: #000; }
    .testimonial-name { font-size: 13px; font-weight: 600; }
    .testimonial-handle { font-size: 12px; color: var(--text-subtle); }

    /* ─── FOOTER ─── */
    .footer { border-top: 1px solid var(--border); padding: 60px 24px; }
    .footer-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .footer-copy { font-size: 13px; color: var(--text-subtle); }
    .footer-links { display: flex; gap: 24px; }
    .footer-links a { font-size: 13px; color: var(--text-muted); }
    .footer-links a:hover { color: var(--accent); }

    /* ─── LOGIN PAGE ─── */
    .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-box { width: 100%; max-width: 420px; }
    .login-box h1 { font-size: 32px; font-weight: 900; letter-spacing: -1px; text-align: center; margin-bottom: 8px; }
    .login-box .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 40px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
    .form-input { width: 100%; padding: 14px 16px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border); color: var(--text); font-size: 15px; outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--text-subtle); }
    .form-btn { width: 100%; padding: 16px; border-radius: var(--radius-sm); background: var(--accent); color: #000; font-size: 15px; font-weight: 800; transition: all 0.3s; margin-top: 8px; }
    .form-btn:hover { box-shadow: 0 8px 30px rgba(57,255,20,0.4); }
    .form-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-error { color: var(--red); font-size: 13px; text-align: center; margin-top: 16px; }
    .form-divider { text-align: center; color: var(--text-subtle); font-size: 13px; margin: 24px 0; }

    /* ─── DASHBOARD ─── */
    .dash { display: flex; min-height: 100vh; }
    .dash-sidebar { width: 260px; background: var(--bg-card); border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; }
    .dash-sidebar-logo { font-size: 18px; font-weight: 900; padding: 0 8px; margin-bottom: 32px; }
    .dash-sidebar-logo span { color: var(--accent); }
    .dash-nav { flex: 1; }
    .dash-nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.2s; margin-bottom: 4px; }
    .dash-nav-item:hover { background: var(--bg-hover); color: var(--text); }
    .dash-nav-item.active { background: var(--accent-dim); color: var(--accent); }
    .dash-nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .dash-nav-section { font-size: 11px; font-weight: 700; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.08em; padding: 20px 14px 8px; }
    .dash-sidebar-footer { padding: 16px 8px; border-top: 1px solid var(--border); }
    .dash-user { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .dash-user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #000; flex-shrink: 0; }
    .dash-user-info { overflow: hidden; }
    .dash-user-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dash-user-plan { font-size: 11px; color: var(--accent); font-weight: 600; text-transform: uppercase; }

    .dash-main { flex: 1; margin-left: 260px; padding: 32px; }
    .dash-header { margin-bottom: 32px; }
    .dash-header h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
    .dash-header p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    /* Dashboard Cards */
    .dash-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
    .dash-stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .dash-stat-label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .dash-stat-value { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
    .dash-stat-value .accent { color: var(--accent); }

    /* License Info */
    .license-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; margin-bottom: 24px; }
    .license-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
    .license-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .license-field { }
    .license-field-label { font-size: 12px; color: var(--text-subtle); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .license-field-value { font-size: 14px; font-weight: 500; }
    .license-key-display { display: flex; align-items: center; gap: 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 20px; }
    .license-key-text { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: 2px; flex: 1; }
    .copy-btn { padding: 8px 16px; border-radius: 8px; background: var(--accent-dim); border: 1px solid rgba(57,255,20,0.2); color: var(--accent); font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .copy-btn:hover { background: var(--accent); color: #000; }

    /* ─── IMAGE GENERATOR ─── */
    .imgen { max-width: 1000px; }
    .imgen-workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .imgen-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .imgen-panel h3 { font-size: 15px; font-weight: 700; margin-bottom: 20px; }
    .imgen-canvas-wrap { aspect-ratio: 1; background: #111; border-radius: var(--radius-sm); overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
    .imgen-canvas-wrap canvas { width: 100%; height: 100%; }
    .imgen-templates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
    .imgen-template { aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
    .imgen-template:hover { transform: scale(1.05); }
    .imgen-template.active { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
    .imgen-upload { width: 100%; padding: 40px; border: 2px dashed var(--border-light); border-radius: var(--radius-sm); text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 20px; }
    .imgen-upload:hover { border-color: var(--accent); background: var(--accent-dim); }
    .imgen-upload p { font-size: 14px; color: var(--text-muted); }
    .imgen-upload .upload-icon { font-size: 32px; margin-bottom: 8px; }
    .imgen-slider { width: 100%; margin: 8px 0; accent-color: var(--accent); }
    .imgen-field { margin-bottom: 16px; }
    .imgen-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .imgen-actions { display: flex; gap: 12px; margin-top: 20px; }
    .imgen-btn { flex: 1; padding: 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; text-align: center; transition: all 0.2s; }
    .imgen-btn-primary { background: var(--accent); color: #000; }
    .imgen-btn-primary:hover { box-shadow: 0 4px 20px rgba(57,255,20,0.4); }
    .imgen-btn-secondary { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text); }

    /* ─── DOWNLOAD PAGE ─── */
    .download-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; text-align: center; max-width: 500px; }
    .download-icon { font-size: 48px; margin-bottom: 16px; }
    .download-card h3 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .download-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
    .download-steps { text-align: left; margin-bottom: 24px; }
    .download-step { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text-muted); }
    .download-step:last-child { border: none; }
    .download-step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex-shrink: 0; }

    /* ─── UTILITIES ─── */
    .hidden { display: none !important; }
    .badge { display: inline-flex; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge-green { background: rgba(57,255,20,0.1); color: var(--accent); }
    .badge-red { background: rgba(239,68,68,0.1); color: var(--red); }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.4s ease-out; }

    /* Mobile */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hero h1 { font-size: 40px; letter-spacing: -2px; }
      .hero-stats { gap: 24px; }
      .hero-stat-num { font-size: 24px; }
      .features-grid { grid-template-columns: 1fr; }
      .pricing-grid { grid-template-columns: 1fr; }
      .testimonials-row { grid-template-columns: 1fr; }
      .dash-sidebar { display: none; }
      .dash-main { margin-left: 0; }
      .dash-stats { grid-template-columns: 1fr; }
      .imgen-workspace { grid-template-columns: 1fr; }
      .license-grid { grid-template-columns: 1fr; }
      .footer-inner { flex-direction: column; gap: 16px; text-align: center; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════ -->
<!-- APP ROOT — SPA router switches pages here          -->
<!-- ═══════════════════════════════════════════════════ -->
<div id="app"></div>

<script>
// ─── STATE ──────────────────────────────────────────
const API = window.location.origin;
let currentPage = 'home';
let user = null; // { key, domain, plan, ... }
let isAdmin = false;

// ─── ROUTER ─────────────────────────────────────────
function navigate(page) {
  currentPage = page;
  const path = page === 'home' ? '/' : '/' + page;
  history.pushState({page}, '', path);
  render();
  window.scrollTo(0, 0);
}

window.addEventListener('popstate', (e) => {
  currentPage = e.state?.page || getPageFromPath();
  render();
});

function getPageFromPath() {
  const p = location.pathname.replace(/^\//, '') || 'home';
  if (p.startsWith('dashboard')) return p;
  return p;
}

// ─── API CALLS ──────────────────────────────────────
async function apiLogin(licenseKey) {
  const res = await fetch(API + '/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ licenseKey })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Login failed');
  return data;
}

// ─── TEMPLATES ──────────────────────────────────────

function renderNav(transparent = true) {
  const isLoggedIn = !!user;
  return `
    <nav class="nav ${transparent ? '' : 'scrolled'}" id="main-nav">
      <div class="nav-inner">
        <a class="nav-logo" href="#" onclick="event.preventDefault();navigate('home')">OG<span>Vendors</span></a>
        <div class="nav-links">
          <a href="#" onclick="event.preventDefault();navigate('home')">Home</a>
          <a href="#" onclick="event.preventDefault();navigate('theme')">Theme</a>
          <a href="#" onclick="event.preventDefault();navigate('pricing')">Pricing</a>
          ${isLoggedIn
            ? `<a href="#" onclick="event.preventDefault();navigate('dashboard')" class="nav-btn nav-btn-primary">Dashboard</a>`
            : `<a href="#" onclick="event.preventDefault();navigate('login')" class="nav-btn nav-btn-outline">Login</a>
               <a href="#" onclick="event.preventDefault();navigate('pricing')" class="nav-btn nav-btn-primary">Get Started</a>`
          }
        </div>
      </div>
    </nav>`;
}

function renderFooter() {
  return `
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-copy">&copy; ${new Date().getFullYear()} OGVendors. All rights reserved.</div>
        <div class="footer-links">
          <a href="#" onclick="event.preventDefault();navigate('theme')">Theme</a>
          <a href="#" onclick="event.preventDefault();navigate('pricing')">Pricing</a>
          <a href="#" onclick="event.preventDefault();navigate('login')">Login</a>
        </div>
      </div>
    </footer>`;
}

// ─── HOME PAGE ──────────────────────────────────────
function renderHome() {
  return `
    ${renderNav(true)}
    <section class="hero">
      <div class="hero-content fade-in">
        <div class="hero-badge"><span class="dot"></span> Trusted by 500+ resellers</div>
        <h1>The #1 Theme for <span class="accent">Resellers</span></h1>
        <p>Build a professional Shopify store in minutes. Conversion-optimized, fully customizable, and built specifically for selling digital products.</p>
        <div class="hero-actions">
          <a href="#" onclick="event.preventDefault();navigate('pricing')" class="btn-lg btn-accent">Get Started</a>
          <a href="#" onclick="event.preventDefault();navigate('theme')" class="btn-lg btn-ghost">See Features</a>

async function handleLogin() {
  const input = document.getElementById('login-key');
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  const key = input.value.trim();
  if (!key) { err.textContent = 'Please enter a license key'; err.classList.remove('hidden'); return; }

  btn.disabled = true;
  btn.textContent = 'Signing in...';
  err.classList.add('hidden');

  try {
    const data = await apiLogin(key);
    user = data.license;
    localStorage.setItem('og_license', JSON.stringify(user));
    // Check admin
    const adminRes = await fetch(API + '/api/auth/check-admin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminKey: key })
    });
    const adminData = await adminRes.json();
    isAdmin = adminData.isAdmin;
    localStorage.setItem('og_admin', isAdmin ? '1' : '0');
    navigate('dashboard');
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

function selectBg(i) {
  imgenState.bgTemplate = i;
  render();

function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => { imgenState.productImg = img; drawCanvas(); };
  img.src = URL.createObjectURL(file);
}

function drawCanvas() {
  const canvas = document.getElementById('imgen-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = 1080, H = 1080;

  // Background
  const bg = bgTemplates[imgenState.bgTemplate];
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, bg.colors[0]);
  grad.addColorStop(1, bg.colors[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Add subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let i = 0; i < W; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke(); }
  for (let i = 0; i < H; i += 40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke(); }

  // Glow behind product
  if (imgenState.productImg) {
    const glowGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 350);
    glowGrad.addColorStop(0, 'rgba(57,255,20,0.08)');
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, 0, W, H);
  }

  // Product image
  if (imgenState.productImg) {
    const img = imgenState.productImg;
    const scale = imgenState.productScale / 100;
    const maxSize = W * 0.8;
    const ratio = Math.min(maxSize / img.width, maxSize / img.height) * scale;
    const dw = img.width * ratio;
    const dh = img.height * ratio;
    const dx = (W - dw) / 2;
    const dy = (H - dh) * (imgenState.productY / 100);

    // Shadow
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 60;
    ctx.shadowOffsetY = 20;
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
  }

  // Top text
  if (imgenState.textTop) {
    ctx.fillStyle = imgenState.textColor;
    ctx.font = `900 ${imgenState.fontSize * 2}px Inter, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    // Text shadow
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 10;
    ctx.fillText(imgenState.textTop, W/2, 60);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
  }

  // Bottom text
  if (imgenState.textBottom) {
    ctx.fillStyle = imgenState.textColor;
    ctx.font = `800 ${imgenState.fontSize * 1.5}px Inter, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 10;
    ctx.fillText(imgenState.textBottom, W/2, H - 60);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
  }
}

function downloadImage() {
  const canvas = document.getElementById('imgen-canvas');
  if (!canvas) return;
  const link = document.createElement('a');
  link.download = 'product-image.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function resetImgen() {
  imgenState = { bgTemplate: 0, productImg: null, productScale: 70, productY: 50, textTop: '', textBottom: '', textColor: '#ffffff', fontSize: 32 };
  render();
  drawCanvas();
}

// ─── LOGOUT ─────────────────────────────────────────
function handleLogout() {
  user = null;
  isAdmin = false;
  localStorage.removeItem('og_license');
  localStorage.removeItem('og_admin');
  navigate('home');
}

// ─── RENDER ─────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  let page = currentPage;

  if (page === 'home') app.innerHTML = renderHome();
  else if (page === 'theme') app.innerHTML = renderTheme();
  else if (page === 'pricing') app.innerHTML = renderPricing();
  else if (page === 'login') app.innerHTML = renderLogin();
  else if (page.startsWith('dashboard')) app.innerHTML = renderDashboard();
  else app.innerHTML = renderHome();

  // Init canvas after render
  if (page.includes('image-generator')) {
    setTimeout(drawCanvas, 50);
  }

  // Nav scroll effect
  if (['home', 'theme', 'pricing'].includes(page)) {
    initNavScroll();
  }
}

function initNavScroll() {
  const nav = document.getElementById('main-nav');
  if (!nav) return;
  const handler = () => {
    if (window.scrollY > 50) nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');
  };
  window.removeEventListener('scroll', handler);
  window.addEventListener('scroll', handler);
  handler();
}

// ─── INIT ───────────────────────────────────────────
(function init() {
  // Restore session
  const saved = localStorage.getItem('og_license');
  if (saved) {
    try { user = JSON.parse(saved); } catch(e) {}
  }
  isAdmin = localStorage.getItem('og_admin') === '1';

  currentPage = getPageFromPath();
  render();
})();
</script>
