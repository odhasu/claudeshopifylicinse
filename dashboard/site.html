<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OGVendors — Premium Shopify Theme for Resellers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --bg-white: #ffffff;
      --bg-card: #ffffff;
      --bg-elevated: #f1f5f9;
      --bg-hover: #f8fafc;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --accent-blue: #2563eb;
      --accent-indigo: #4f46e5;
      --accent-gradient: linear-gradient(135deg, #2563eb, #4f46e5);
      --accent-gradient-r: linear-gradient(to right top, #2563eb, #4f46e5);
      --accent-dim: rgba(37,99,235,0.08);
      --accent-glow: rgba(79,70,229,0.15);
      --green: #059669;
      --green-bg: #d1fae5;
      --red: #ef4444;
      --purple: #9333ea;
      --purple-bg: #f3e8ff;
      --blue-bg: #dbeafe;
      --text: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius: 20px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.03);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.06), 0 4px 10px rgba(0,0,0,0.04);
      --shadow-xl: 0 20px 50px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; }
    input { font-family: inherit; }
    img { display: block; max-width: 100%; }

    /* ─── PAGE WRAPPER WITH SIDE GRADIENTS ─── */
    .page-wrap { position: relative; overflow: hidden; }
    .page-wrap::before { content: ''; position: fixed; top: 0; left: 0; width: 15%; height: 100%; background: linear-gradient(to right, rgba(59,130,246,0.12), rgba(96,165,250,0.06), transparent); pointer-events: none; z-index: 0; }
    .page-wrap::after { content: ''; position: fixed; top: 0; right: 0; width: 15%; height: 100%; background: linear-gradient(to left, rgba(99,102,241,0.12), rgba(129,140,248,0.06), transparent); pointer-events: none; z-index: 0; }

    /* ─── NAVIGATION ─── */
    .nav { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 100; width: calc(100% - 32px); max-width: 900px; }
    .nav-pill { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 999px; padding: 8px 8px 8px 20px; box-shadow: var(--shadow-lg); }
    .nav-logo { font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
    .nav-logo-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; }
    .nav-logo-icon svg { width: 16px; height: 16px; fill: white; }
    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-link { padding: 8px 16px; font-size: 14px; font-weight: 500; color: var(--text-muted); border-radius: 999px; transition: all 0.2s; }
    .nav-link:hover { color: var(--text); background: var(--bg-elevated); }
    .nav-btn { padding: 10px 22px; border-radius: 999px; font-size: 13px; font-weight: 600; transition: all 0.3s; }
    .nav-btn-primary { background: var(--accent-gradient); color: white; box-shadow: 0 2px 8px rgba(37,99,235,0.3); }
    .nav-btn-primary:hover { box-shadow: 0 4px 16px rgba(37,99,235,0.4); transform: translateY(-1px); }
    .nav-btn-ghost { color: var(--text-muted); }
    .nav-btn-ghost:hover { color: var(--text); background: var(--bg-elevated); }

    /* ─── HERO ─── */
    .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 120px 24px 60px; position: relative; z-index: 1; }
    .hero-ticker { display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; border-radius: 999px; background: var(--bg-white); border: 1px solid var(--border); font-size: 14px; font-weight: 500; color: var(--text-muted); margin-bottom: 40px; box-shadow: var(--shadow); }
    .hero-ticker .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .hero-ticker strong { color: var(--text); font-weight: 700; }
    .hero h1 { font-size: clamp(40px, 7vw, 64px); font-weight: 900; letter-spacing: -2px; line-height: 1.05; color: var(--text); margin-bottom: 24px; }
    .hero h1 .highlight { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero p { font-size: 17px; color: var(--text-muted); line-height: 1.7; max-width: 520px; margin: 0 auto 40px; }
    .hero-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-primary { display: inline-flex; align-items: center; gap: 8px; padding: 16px 32px; border-radius: var(--radius-md); background: var(--accent-gradient-r); color: white; font-size: 16px; font-weight: 600; transition: all 0.3s; box-shadow: 0 4px 15px rgba(37,99,235,0.3); }
    .btn-primary:hover { box-shadow: 0 8px 25px rgba(37,99,235,0.4); transform: translateY(-2px); }
    .btn-primary svg { width: 18px; height: 18px; }
    .btn-secondary { display: inline-flex; align-items: center; gap: 8px; padding: 16px 32px; border-radius: var(--radius-md); background: var(--bg-white); border: 1px solid var(--border); color: var(--text-secondary); font-size: 16px; font-weight: 600; transition: all 0.2s; }
    .btn-secondary:hover { border-color: #cbd5e1; background: var(--bg-elevated); }
    .hero-badges { display: flex; gap: 24px; justify-content: center; margin-top: 48px; }
    .hero-badge { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--text-muted); }
    .hero-badge .badge-icon { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .hero-badge .badge-green { background: var(--green-bg); color: var(--green); }
    .hero-badge .badge-blue { background: var(--blue-bg); color: var(--accent-blue); }
    .hero-badge .badge-purple { background: var(--purple-bg); color: var(--purple); }

    /* ─── STATS BAR ─── */
    .stats-bar { display: flex; justify-content: center; gap: 48px; padding: 60px 24px; position: relative; z-index: 1; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 36px; font-weight: 900; letter-spacing: -1.5px; color: var(--text); }
    .stat-label { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    /* ─── SECTIONS ─── */
    .section { padding: 80px 24px; position: relative; z-index: 1; }
    .section-alt { background: var(--bg-white); }
    .section-header { text-align: center; max-width: 560px; margin: 0 auto 56px; }
    .section-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 16px; }
    .section-badge-green { background: var(--green-bg); color: var(--green); }
    .section-badge-blue { background: var(--blue-bg); color: var(--accent-blue); }
    .section-badge-purple { background: var(--purple-bg); color: var(--purple); }
    .section-header h2 { font-size: clamp(28px, 5vw, 40px); font-weight: 800; letter-spacing: -1.5px; color: var(--text); margin-bottom: 12px; }
    .section-header p { font-size: 16px; color: var(--text-muted); line-height: 1.6; }

    /* ─── FEATURES GRID ─── */
    .features-grid { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .feature-card { background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; transition: all 0.3s; }
    .feature-card:hover { border-color: rgba(37,99,235,0.3); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
    .feature-icon { width: 44px; height: 44px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 16px; }
    .feature-icon-blue { background: var(--blue-bg); }
    .feature-icon-green { background: var(--green-bg); }
    .feature-icon-purple { background: var(--purple-bg); }
    .feature-card h3 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .feature-card p { font-size: 14px; color: var(--text-muted); line-height: 1.5; }

    /* ─── PRICING ─── */
    .pricing-grid { max-width: 800px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .pricing-card { background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius); padding: 36px; position: relative; transition: all 0.3s; }
    .pricing-card:hover { box-shadow: var(--shadow-xl); }
    .pricing-card.featured { border-color: var(--accent-blue); box-shadow: 0 0 0 1px var(--accent-blue), var(--shadow-xl); }
    .pricing-badge { display: inline-flex; padding: 5px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; background: var(--accent-dim); color: var(--accent-blue); }
    .pricing-card.featured .pricing-badge { background: var(--accent-gradient); color: white; }
    .pricing-name { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .pricing-price { font-size: 48px; font-weight: 900; letter-spacing: -2px; color: var(--text); margin-bottom: 2px; }
    .pricing-price span { font-size: 15px; font-weight: 500; color: var(--text-muted); letter-spacing: 0; }
    .pricing-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; }
    .pricing-features { list-style: none; margin-bottom: 28px; }
    .pricing-features li { padding: 8px 0; font-size: 14px; color: var(--text-secondary); display: flex; align-items: center; gap: 10px; }
    .pricing-features .check { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; }
    .pricing-features .check-green { background: var(--green-bg); color: var(--green); }
    .pricing-features .check-blue { background: var(--blue-bg); color: var(--accent-blue); }
    .pricing-btn { width: 100%; padding: 14px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; text-align: center; transition: all 0.3s; display: block; }
    .pricing-btn-primary { background: var(--accent-gradient); color: white; box-shadow: 0 2px 10px rgba(37,99,235,0.3); }
    .pricing-btn-primary:hover { box-shadow: 0 4px 20px rgba(37,99,235,0.4); transform: translateY(-1px); }
    .pricing-btn-dark { background: var(--text); color: white; }
    .pricing-btn-dark:hover { background: #1e293b; }

    /* ─── TESTIMONIALS ─── */
    .testimonials-row { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .testimonial-card { background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .testimonial-stars { color: #f59e0b; font-size: 14px; margin-bottom: 12px; letter-spacing: 2px; }
    .testimonial-text { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
    .testimonial-author { display: flex; align-items: center; gap: 10px; }
    .testimonial-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: white; flex-shrink: 0; }
    .testimonial-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .testimonial-handle { font-size: 12px; color: var(--text-subtle); }

    /* ─── FAQ ─── */
    .faq-list { max-width: 640px; margin: 0 auto; }
    .faq-item { background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 10px; overflow: hidden; transition: all 0.2s; }
    .faq-item:hover { border-color: #cbd5e1; }
    .faq-q { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; cursor: pointer; font-weight: 600; font-size: 15px; color: var(--text); }
    .faq-q svg { width: 18px; height: 18px; color: var(--text-subtle); transition: transform 0.3s; flex-shrink: 0; }
    .faq-item.open .faq-q svg { transform: rotate(180deg); }
    .faq-a { max-height: 0; overflow: hidden; transition: max-height 0.35s ease, padding 0.35s ease; }
    .faq-item.open .faq-a { max-height: 300px; padding: 0 22px 18px; }
    .faq-a p { font-size: 14px; color: var(--text-muted); line-height: 1.7; }

    /* ─── FOOTER ─── */
    .footer { border-top: 1px solid var(--border); padding: 48px 24px; position: relative; z-index: 1; background: var(--bg-white); }
    .footer-inner { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .footer-copy { font-size: 13px; color: var(--text-subtle); }
    .footer-links { display: flex; gap: 20px; }
    .footer-links a { font-size: 13px; color: var(--text-muted); transition: color 0.2s; }
    .footer-links a:hover { color: var(--accent-blue); }

    /* ─── LOGIN PAGE ─── */
    .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; z-index: 1; }
    .login-box { width: 100%; max-width: 400px; background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; box-shadow: var(--shadow-xl); }
    .login-box h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; text-align: center; margin-bottom: 6px; }
    .login-box .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px 16px; border-radius: var(--radius-sm); background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 15px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .form-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px var(--accent-dim); }
    .form-input::placeholder { color: var(--text-subtle); }
    .form-btn { width: 100%; padding: 14px; border-radius: var(--radius-sm); background: var(--accent-gradient); color: white; font-size: 15px; font-weight: 700; transition: all 0.3s; margin-top: 8px; box-shadow: 0 2px 10px rgba(37,99,235,0.25); }
    .form-btn:hover { box-shadow: 0 4px 20px rgba(37,99,235,0.4); transform: translateY(-1px); }
    .form-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .form-error { color: var(--red); font-size: 13px; text-align: center; margin-top: 12px; }
    .form-footer { text-align: center; color: var(--text-subtle); font-size: 13px; margin-top: 20px; }
    .form-footer a { color: var(--accent-blue); font-weight: 600; }

    /* ─── DASHBOARD ─── */
    .dash { display: flex; min-height: 100vh; background: var(--bg); }
    .dash-sidebar { width: 260px; background: var(--bg-white); border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; }
    .dash-sidebar-logo { font-size: 17px; font-weight: 800; padding: 0 8px; margin-bottom: 28px; display: flex; align-items: center; gap: 8px; color: var(--text); }
    .dash-sidebar-logo .logo-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; }
    .dash-sidebar-logo .logo-icon svg { width: 16px; height: 16px; fill: white; }
    .dash-nav { flex: 1; }
    .dash-nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-xs); font-size: 14px; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.15s; margin-bottom: 2px; }
    .dash-nav-item:hover { background: var(--bg-elevated); color: var(--text); }
    .dash-nav-item.active { background: var(--accent-dim); color: var(--accent-blue); font-weight: 600; }
    .dash-nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .dash-nav-section { font-size: 11px; font-weight: 700; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.08em; padding: 16px 12px 6px; }
    .dash-sidebar-footer { padding: 16px 8px; border-top: 1px solid var(--border); }
    .dash-user { display: flex; align-items: center; gap: 10px; }
    .dash-user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: white; flex-shrink: 0; }
    .dash-user-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .dash-user-plan { font-size: 11px; color: var(--accent-blue); font-weight: 600; text-transform: uppercase; }

    .dash-main { flex: 1; margin-left: 260px; padding: 32px; }
    .dash-header { margin-bottom: 28px; }
    .dash-header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
    .dash-header p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    .dash-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .dash-stat-card { background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 22px; }
    .dash-stat-label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .dash-stat-value { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
    .dash-stat-value .green { color: var(--green); }
    .dash-stat-value .blue { color: var(--accent-blue); }

    .info-card { background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 28px; margin-bottom: 16px; }
    .info-card h3 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 16px; }
    .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .info-field-label { font-size: 12px; color: var(--text-subtle); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .info-field-value { font-size: 14px; font-weight: 500; color: var(--text); }
    .license-display { display: flex; align-items: center; gap: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 16px; }
    .license-display-key { font-size: 17px; font-weight: 700; letter-spacing: 1px; flex: 1; color: var(--text); }
    .copy-btn { padding: 7px 14px; border-radius: var(--radius-xs); background: var(--accent-dim); color: var(--accent-blue); font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid rgba(37,99,235,0.15); transition: all 0.2s; }
    .copy-btn:hover { background: var(--accent-gradient); color: white; border-color: transparent; }

    .quick-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .quick-card { background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; cursor: pointer; transition: all 0.2s; }
    .quick-card:hover { border-color: rgba(37,99,235,0.3); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .quick-card-icon { font-size: 28px; margin-bottom: 10px; }
    .quick-card h3 { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .quick-card p { font-size: 13px; color: var(--text-muted); }

    /* ─── IMAGE GENERATOR ─── */
    .imgen-workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1000px; }
    .imgen-panel { background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; }
    .imgen-panel h3 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 16px; }
    .imgen-canvas-wrap { aspect-ratio: 1; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .imgen-canvas-wrap canvas { width: 100%; height: 100%; }
    .imgen-templates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 16px; }
    .imgen-template { aspect-ratio: 1; border-radius: var(--radius-xs); cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
    .imgen-template:hover { transform: scale(1.05); }
    .imgen-template.active { border-color: var(--accent-blue); box-shadow: 0 0 10px var(--accent-dim); }
    .imgen-upload { width: 100%; padding: 32px; border: 2px dashed var(--border); border-radius: var(--radius-sm); text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 16px; }
    .imgen-upload:hover { border-color: var(--accent-blue); background: var(--accent-dim); }
    .imgen-upload p { font-size: 13px; color: var(--text-muted); }
    .imgen-upload .upload-icon { font-size: 28px; margin-bottom: 6px; }
    .imgen-slider { width: 100%; margin: 6px 0; accent-color: var(--accent-blue); }

  const res = await fetch(API + '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ licenseKey }) });

  if (!res.ok) throw new Error(data.error || 'Login failed');

        <div class="form-error hidden" id="login-error"></div>

      </div>

async function handleLogin() {
  const input = document.getElementById('login-key');
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  const key = input.value.trim();
  if (!key) { err.textContent = 'Please enter a license key'; err.classList.remove('hidden'); return; }
  btn.disabled = true; btn.textContent = 'Signing in...'; err.classList.add('hidden');
  try {
    const data = await apiLogin(key);
    user = data.license;
    localStorage.setItem('og_license', JSON.stringify(user));
    const adminRes = await fetch(API + '/api/auth/check-admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ adminKey: key }) });
    const adminData = await adminRes.json();
    isAdmin = adminData.isAdmin;
    localStorage.setItem('og_admin', isAdmin ? '1' : '0');
    navigate('dashboard');
  } catch (e) {
    err.textContent = e.message; err.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Sign In';
  }
}

}

// ─── IMAGE GENERATOR ────────────────────────────────
let imgenState = { bgTemplate: 0, productImg: null, productScale: 70, productY: 50, textTop: '', textBottom: '', textColor: '#ffffff', fontSize: 32 };
const bgTemplates = [
  { name: 'Midnight', colors: ['#0a0a0a', '#1a1a2e'] },
  { name: 'Emerald', colors: ['#064e3b', '#0a0a0a'] },
  { name: 'Crimson', colors: ['#7f1d1d', '#0a0a0a'] },
  { name: 'Royal', colors: ['#1e1b4b', '#0a0a0a'] },
  { name: 'Sunset', colors: ['#9a3412', '#1c1917'] },
  { name: 'Neon', colors: ['#0a0a0a', '#052e16'] },
  { name: 'Storm', colors: ['#1e293b', '#0f172a'] },
  { name: 'Grape', colors: ['#581c87', '#0a0a0a'] },
];

function renderImageGen() {
  return `
    <div class="dash-header"><h1>Image Generator</h1><p>Create professional product images with custom backgrounds and text</p></div>
    <div class="imgen-workspace">
      <div class="imgen-panel">
        <h3>Preview</h3>
        <div class="imgen-canvas-wrap"><canvas id="imgen-canvas" width="1080" height="1080"></canvas></div>
        <div class="imgen-actions">
          <button class="imgen-btn imgen-btn-primary" onclick="downloadImage()">Download PNG</button>
          <button class="imgen-btn imgen-btn-secondary" onclick="resetImgen()">Reset</button>
        </div>
      </div>
      <div class="imgen-panel">
        <h3>Background</h3>
        <div class="imgen-templates">${bgTemplates.map((t,i) => `<div class="imgen-template ${imgenState.bgTemplate===i?'active':''}" style="background:linear-gradient(135deg,${t.colors[0]},${t.colors[1]});" title="${t.name}" onclick="selectBg(${i})"></div>`).join('')}</div>
        <h3>Product Image</h3>
        <div class="imgen-upload" onclick="document.getElementById('imgen-file').click()">
          <div class="upload-icon">&#x1f4f7;</div>
          <p>${imgenState.productImg ? 'Image loaded — click to change' : 'Click to upload product image'}</p>
        </div>
        <input type="file" id="imgen-file" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
        <div class="imgen-field"><label>Product Size: ${imgenState.productScale}%</label><input type="range" class="imgen-slider" min="20" max="100" value="${imgenState.productScale}" oninput="imgenState.productScale=+this.value;drawCanvas()"></div>
        <div class="imgen-field"><label>Vertical Position: ${imgenState.productY}%</label><input type="range" class="imgen-slider" min="0" max="100" value="${imgenState.productY}" oninput="imgenState.productY=+this.value;drawCanvas()"></div>
        <h3 style="margin-top:16px;">Text Overlay</h3>
        <div class="imgen-field"><label>Top Text</label><input class="form-input" placeholder="e.g. NEW DROP" value="${imgenState.textTop}" oninput="imgenState.textTop=this.value;drawCanvas()"></div>
        <div class="imgen-field"><label>Bottom Text</label><input class="form-input" placeholder="e.g. $29.99" value="${imgenState.textBottom}" oninput="imgenState.textBottom=this.value;drawCanvas()"></div>
        <div style="display:flex;gap:10px;">
          <div class="imgen-field" style="flex:1;"><label>Text Color</label><input type="color" value="${imgenState.textColor}" style="width:100%;height:34px;border:none;border-radius:8px;cursor:pointer;" onchange="imgenState.textColor=this.value;drawCanvas()"></div>
          <div class="imgen-field" style="flex:1;"><label>Font Size: ${imgenState.fontSize}px</label><input type="range" class="imgen-slider" min="16" max="72" value="${imgenState.fontSize}" oninput="imgenState.fontSize=+this.value;drawCanvas()"></div>
        </div>
      </div>
    </div>`;
}

function selectBg(i) { imgenState.bgTemplate = i; render(); drawCanvas(); }
function handleImageUpload(e) { const f = e.target.files[0]; if(!f)return; const img = new Image(); img.onload = () => { imgenState.productImg = img; drawCanvas(); }; img.src = URL.createObjectURL(f); }
function drawCanvas() {
  const canvas = document.getElementById('imgen-canvas'); if(!canvas)return;
  const ctx = canvas.getContext('2d'); const W = 1080, H = 1080;
  const bg = bgTemplates[imgenState.bgTemplate];
  const grad = ctx.createLinearGradient(0,0,W,H); grad.addColorStop(0,bg.colors[0]); grad.addColorStop(1,bg.colors[1]);
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
  for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
  for(let i=0;i<H;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}
  if(imgenState.productImg){const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,350);g.addColorStop(0,'rgba(37,99,235,0.1)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  if(imgenState.productImg){const img=imgenState.productImg;const s=imgenState.productScale/100;const m=W*0.8;const r=Math.min(m/img.width,m/img.height)*s;const dw=img.width*r;const dh=img.height*r;const dx=(W-dw)/2;const dy=(H-dh)*(imgenState.productY/100);ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=60;ctx.shadowOffsetY=20;ctx.drawImage(img,dx,dy,dw,dh);ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;}
  if(imgenState.textTop){ctx.fillStyle=imgenState.textColor;ctx.font=`900 ${imgenState.fontSize*2}px Inter,sans-serif`;ctx.textAlign='center';ctx.textBaseline='top';ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=10;ctx.fillText(imgenState.textTop,W/2,60);ctx.shadowColor='transparent';ctx.shadowBlur=0;}
  if(imgenState.textBottom){ctx.fillStyle=imgenState.textColor;ctx.font=`800 ${imgenState.fontSize*1.5}px Inter,sans-serif`;ctx.textAlign='center';ctx.textBaseline='bottom';ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=10;ctx.fillText(imgenState.textBottom,W/2,H-60);ctx.shadowColor='transparent';ctx.shadowBlur=0;}
}
function downloadImage(){const c=document.getElementById('imgen-canvas');if(!c)return;const l=document.createElement('a');l.download='product-image.png';l.href=c.toDataURL('image/png');l.click();}
function resetImgen(){imgenState={bgTemplate:0,productImg:null,productScale:70,productY:50,textTop:'',textBottom:'',textColor:'#ffffff',fontSize:32};render();drawCanvas();}

function renderDownload() {
  return `
    <div class="dash-header"><h1>Download Theme</h1><p>Download and install the OGVendors theme on your Shopify store</p></div>
    <div class="download-card">
      <div class="download-icon">&#x1f4e6;</div>
      <h3>OGVendors Theme v3</h3>
      <p>Latest version with all features included</p>
      <div class="download-steps">
        <div class="download-step"><div class="download-step-num">1</div><span>Download the ZIP file below</span></div>
        <div class="download-step"><div class="download-step-num">2</div><span>Go to Shopify Admin > Online Store > Themes</span></div>
        <div class="download-step"><div class="download-step-num">3</div><span>Click "Add theme" > "Upload ZIP file"</span></div>
        <div class="download-step"><div class="download-step-num">4</div><span>Open Theme Settings > License & Protection</span></div>
        <div class="download-step"><div class="download-step-num">5</div><span>Enter your license key: <strong style="color:var(--accent-blue);">${user?.key||''}</strong></span></div>
        <div class="download-step"><div class="download-step-num">6</div><span>Save and publish!</span></div>
      </div>
      <button class="form-btn" onclick="window.open(API+'/api/admin/download-theme?admin_key=og','_blank')">Download Theme ZIP</button>
    </div>`;
}

function renderSetup() {
  const steps = [
    { title: '1. Install the Theme', body: `Download the theme ZIP from the <a href="#" onclick="event.preventDefault();navigate('dashboard/download')" style="color:var(--accent-blue);font-weight:600;">Download page</a>, then upload it via <strong>Online Store > Themes > Add theme > Upload ZIP</strong>.` },
    { title: '2. Enter Your License Key', body: `Open theme editor > <strong>Theme Settings > License & Protection</strong> and enter: <code style="background:var(--bg);padding:2px 8px;border-radius:4px;color:var(--accent-blue);">${user?.key||''}</code>` },
    { title: '3. Customize Your Store', body: 'Use the theme editor to customize colors, branding, social links, and sections. Everything is drag-and-drop.' },
    { title: '4. Add Products', body: `Add products in Shopify Admin > Products. Use the <a href="#" onclick="event.preventDefault();navigate('dashboard/image-generator')" style="color:var(--accent-blue);font-weight:600;">Image Generator</a> to create professional product images.` },
    { title: '5. Publish & Launch', body: 'Hit <strong>Publish</strong> in the theme editor. Your store is live with server-side rendering and license protection.' },
  ];
  return `
    <div class="dash-header"><h1>Setup Guide</h1><p>Step-by-step instructions to get your store live</p></div>
    ${steps.map(s => `<div class="info-card"><h3>${s.title}</h3><p style="color:var(--text-muted);font-size:14px;line-height:1.8;">${s.body}</p></div>`).join('')}`;
}

function handleLogout() { user = null; isAdmin = false; localStorage.removeItem('og_license'); localStorage.removeItem('og_admin'); navigate('home'); }

// ─── RENDER ─────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  const p = currentPage;
  if (p === 'home') app.innerHTML = renderHome();
  else if (p === 'theme') app.innerHTML = renderTheme();
  else if (p === 'pricing') app.innerHTML = renderPricing();
  else if (p === 'login') app.innerHTML = renderLogin();
  else if (p.startsWith('dashboard')) app.innerHTML = renderDashboard();
  else app.innerHTML = renderHome();
  if (p.includes('image-generator')) setTimeout(drawCanvas, 50);
}

// ─── INIT ───────────────────────────────────────────
(function() {
  const saved = localStorage.getItem('og_license');
  if (saved) try { user = JSON.parse(saved); } catch(e) {}
  isAdmin = localStorage.getItem('og_admin') === '1';
  currentPage = getPageFromPath();
  render();
})();
</script>
